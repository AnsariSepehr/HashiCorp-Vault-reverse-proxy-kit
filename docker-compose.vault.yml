version: '3.8'

# HashiCorp Vault behind an Nginx reverse proxy (TLS termination), deployed
# as a Docker Swarm stack. See README.md for setup instructions.

services:
  vault:
    image: hashicorp/vault:1.14.0
    volumes:
      - ../vault/config/:/vault/config/:ro
      - ../vault/data:/vault/data
    cap_add:
      - IPC_LOCK
    command:
      - "server"
      # To use the config file instead of the plain "server" command above,
      # comment the line above and uncomment the line below:
      # - "server -config=/vault/config/config.hcl"
    networks:
      - vault-net
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: any

  nginx:
    image: nginx:latest
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - ../nginx/logs/:/var/log/nginx/
      - ../nginx/.htpasswd:/etc/nginx/.htpasswd
      - ../nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs/certs.pem:/etc/ssl/certs/certs.pem:ro
      - ../nginx/certs/private.key:/etc/ssl/private/private.key:ro
    depends_on:
      - vault
    networks:
      - vault-net
    deploy:
      mode: global
      restart_policy:
        condition: any

networks:
  vault-net:
    driver: overlay
